name: build-feeds

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (UTC). GH Actions cron runs on a best-effort basis.
  workflow_dispatch: {}      # lets you trigger manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write            # so the job can commit the regenerated feeds + state cache
  pages: write
  id-token: write

concurrency:
  group: build-feeds
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Generate feeds
        env:
          SITE_BASE_URL: "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
        run: python -m src.main

      - name: Commit refreshed feeds + state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ state/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "feeds: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main           # pull the just-committed feeds
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
